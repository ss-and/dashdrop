name: CI

# Every push and PR runs the same four gates the developer runs locally:
# typecheck → lint → unit tests → production build. The build step is the one
# that catches Next.js-specific breakage (server/client boundaries, route
# types) that tsc alone misses.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to the same branch cancels the previous, still-running check.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # The app refuses to boot without these; CI needs its own throwaway values.
      DATABASE_URL: "file:./ci.db"
      AUTH_SECRET: "ci-only-secret-not-used-anywhere-else-0123456789"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # Types across the app come from the generated client, so this has to
        # happen before typecheck — not just before the build.
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Prepare database
        run: npx prisma db push --skip-generate

      - name: Build
        run: npx next build
